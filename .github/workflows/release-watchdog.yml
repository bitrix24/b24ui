name: Release watchdog 🕰️

# Releases are automated (release-please opens the PR, merging it publishes),
# but automation moved the failure rather than removing it. Two ways a fix can
# still sit unshipped, neither of which raises anything on its own:
#
#  1. the release PR stays open — everything is ready, nobody merged it;
#  2. the release PR was merged and the tag exists, but nothing reached npm:
#     the publish dispatch failed, CI never went green, or the run was cancelled.
#
# Issue #315 exists because the first class went unnoticed for five weeks. This
# job checks both once a week and opens (or updates) a single issue.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-watchdog
  cancel-in-progress: false

env:
  # An open release PR older than this is worth a nudge. Deliberately well under
  # the historical cadence (v2.8.0 -> v2.9.0 was 38 days) and well over a normal
  # "merge it next week" gap.
  MAX_OPEN_DAYS: 14

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect findings
        id: check
        shell: bash
        run: |
          : > findings.md

          # 1. Release PR sitting open. release-please labels its PR
          # `autorelease: pending`; matching the label rather than the branch
          # name survives a config change to the branch pattern.
          pr=$(gh api "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '[.[] | select(any(.labels[]; .name == "autorelease: pending"))] | first // empty')

          if [ -n "$pr" ]; then
            number=$(jq -r '.number' <<<"$pr")
            title=$(jq -r '.title' <<<"$pr")
            created=$(jq -r '.created_at' <<<"$pr")
            age=$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 86400 ))
            echo "release PR #$number is $age day(s) old (threshold ${MAX_OPEN_DAYS})"
            if [ "$age" -ge "$MAX_OPEN_DAYS" ]; then
              printf -- '- **#%s (%s) has been open for %s days.** Everything in it is fixed on `main` and not on npm. Merging it tags, releases and publishes.\n' \
                "$number" "$title" "$age" >> findings.md
            fi
          else
            echo "no open release PR — nothing unreleased, or a release is mid-flight"
          fi

          # 2. Tagged but never published. This is the failure the dispatch
          # design can produce: the GitHub Release exists, `npm-publish.yml` was
          # dispatched, and something downstream refused. Nothing else notices.
          tag=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name' 2>/dev/null || echo "")
          if [ -n "$tag" ]; then
            version="${tag#v}"
            name=$(node -p "require('./package.json').name")
            if npm view "$name@$version" version --silent >/dev/null 2>&1; then
              echo "$name@$version is on npm"
            else
              echo "$name@$version is NOT on npm"
              printf -- '- **`%s` is tagged but `%s@%s` is not on npm.** The publish step did not complete. Recovery: Actions -> NPM publish -> Run workflow, with `%s` selected as the ref.\n' \
                "$tag" "$name" "$version" "$tag" >> findings.md
            fi
          fi

          if [ -s findings.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            cat findings.md
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "nothing to report"
          fi

      - name: Open or update the issue
        if: steps.check.outputs.found == 'true'
        shell: bash
        run: |
          title="chore: a release is waiting"

          {
            echo "The weekly release watchdog found something waiting:"
            echo
            cat findings.md
            echo
            echo "Raised by [\`release-watchdog.yml\`](https://github.com/$REPO/blob/main/.github/workflows/release-watchdog.yml). Close this issue once the release is out — a new one is opened if the situation comes back."
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > body.md

          # Matched by title rather than by label, so the workflow cannot fail on
          # a label that was never created in repo settings.
          existing=$(gh api "repos/$REPO/issues?state=open&per_page=100" \
            --jq "[.[] | select(.pull_request == null) | select(.title == \"$title\")] | first // empty")

          if [ -n "$existing" ]; then
            number=$(jq -r '.number' <<<"$existing")
            echo "updating existing issue #$number"
            gh api "repos/$REPO/issues/$number/comments" -F body=@body.md >/dev/null
          else
            echo "opening a new issue"
            gh api "repos/$REPO/issues" -f title="$title" -F body=@body.md >/dev/null
          fi
