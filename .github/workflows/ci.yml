name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Dispatched by release-please.yml onto its release-PR branch. The bot's PR
  # does fire a pull_request event, but GitHub holds that run at
  # `action_required` awaiting manual approval, so the dispatched run is the only
  # `ci` that actually executes there. It does NOT satisfy the required check —
  # branch protection waits on the held run, which a human has to approve. See
  # .github/contributing/releasing.md#approving-the-release-prs-ci.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancelling superseded runs is only safe for PR churn. A main run may be
  # the one await-ci polls before publishing a release — cancelling it strands
  # the tag with nothing on npm.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This workflow executes the most untrusted code in the repository — a full
# `pnpm install` with build scripts, then lint, typecheck, tests and build. It
# needs nothing but read access, and saying so keeps a `push` or dispatch run
# from inheriting a permissive repository default.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      pnpm_config_strict_dep_builds: false
      pnpm_config_verify_deps_before_run: false
      NUXT_PUBLIC_USE_AI: false
      NUXT_PUBLIC_SITE_URL: https://bitrix24.github.io
      NUXT_PUBLIC_BASE_URL: /b24ui
      NUXT_PUBLIC_CANONICAL_URL: https://bitrix24.github.io
      NUXT_PUBLIC_GIT_URL: https://github.com/bitrix24/b24ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two, not the default one: assert-commit-parses.mjs compares
          # `.sync/nuxt-ui.json` at HEAD against HEAD^ to tell a port from a
          # bookkeeping commit. At depth 1 it warns and skips rather than
          # passing quietly, but skipping is not what we want here.
          fetch-depth: 2

      # Pinning actions to commit SHAs is a state; this is the control that keeps
      # it. The realistic way the pins get lost is not carelessness — it is a
      # port: upstream nuxt/ui bumps actions by tag, and PR #297 replayed exactly
      # such a bump here, rewriting `uses:` from @v6 to @v7. A port that does that
      # again fails here instead of silently reopening the hole.
      - name: Assert every action is pinned to a commit SHA
        run: .github/scripts/assert-actions-pinned.py

      # pnpm freezes the lockfile by itself under CI, so this asserts an
      # intention rather than a behaviour: the flag stays written down, and
      # `--no-frozen-lockfile` cannot be slipped in to get a red build green.
      - name: Assert every workflow install is frozen
        run: .github/scripts/assert-lockfile-frozen.py

      # The workflow scripts have no other coverage: they run on a schedule and
      # hold `issues: write`. Several of the bugs three rounds of review found in
      # them shared one shape — a failure inside an `if` condition, which bash
      # exempts from errexit, so the job stays green and the outcome is wrong —
      # and that class is invisible to reading. Stubs make it reproducible in a
      # second.
      - name: Test the workflow scripts
        run: test/workflows/run.sh

      # These are the only shell and Python in a repository whose every other
      # line is linted by eslint and vue-tsc. shellcheck is preinstalled on the
      # runner, so this costs a second and is what keeps them honest when nobody
      # is reading them. Info-level notes are not failures: the `printf` format
      # strings are deliberately single-quoted, and `-x` follows the sourced
      # helper rather than warning that it cannot see it.
      - name: Shellcheck the workflow scripts
        run: shellcheck -x -S warning .github/scripts/*.sh .github/scripts/lib/*.sh test/workflows/*.sh test/workflows/stubs/*

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare
        run: pnpm run dev:prepare

      # release-please drops a commit it cannot parse and says so only at debug
      # level, so a missing changelog entry has no red anywhere — dcb3bacf did
      # exactly that to the 2.12.0 notes (#436).
      #
      # `push` only: ci.yml's push trigger is `branches: [main]`, so every push
      # event here is the message that actually lands. A PR's commits are usually
      # the same text, but the squash subject and body can be rewritten in the
      # merge dialog, so only the message on `main` is certain.
      - name: Assert the commit message will not be dropped from the changelog
        if: github.event_name == 'push'
        run: .github/scripts/assert-commit-parses.mjs

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # `typecheck` runs `vue-tsc --noEmit`; this runs the real declaration emit,
      # which is a different thing and fails on its own (TS2883 on the runtime
      # plugins, from #500's lockfile reshuffle, went unnoticed for three days
      # because nothing here built the module).
      - name: Build the module
        run: pnpm run build

      # Coverage rather than a plain `vitest run`: it is the same suite with the
      # same assertions, plus a gate that goes red when coverage falls below
      # the thresholds in `vitest.config.ts`. Instrumenting every worker costs
      # about 100s on a 240s suite, which is why it is one run here and not a
      # second job — and why it stays off for local runs unless asked for.
      - name: Test
        run: pnpm run test:coverage

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      # A separate invocation, not a third project in the run above. These
      # specs boot Nuxt with `loadNuxt`, and the component suite already sits
      # close to the fork heap limit — see the note in vitest.module.config.ts.
      - name: Test the module
        run: pnpm test:module

      # Everything in this job tests source: `Test` mounts components out of
      # `src/` and `Build` only proves the bundler is happy. Nothing here starts
      # an application — that is smoke.yml, on a schedule (#329).
      - name: Build
        run: pnpm build
