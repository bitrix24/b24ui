name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Dispatched by release-please.yml onto its release-PR branch: PRs opened
  # with GITHUB_TOKEN fire no pull_request event, and a dispatched run on the
  # same head SHA is what satisfies a required `ci` status check.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancelling superseded runs is only safe for PR churn. A main run may be
  # the one await-ci polls before publishing a release — cancelling it strands
  # the tag with nothing on npm.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      pnpm_config_strict_dep_builds: false
      pnpm_config_verify_deps_before_run: false
      NUXT_PUBLIC_USE_AI: false
      NUXT_PUBLIC_SITE_URL: https://bitrix24.github.io
      NUXT_PUBLIC_BASE_URL: /b24ui
      NUXT_PUBLIC_CANONICAL_URL: https://bitrix24.github.io
      NUXT_PUBLIC_GIT_URL: https://github.com/bitrix24/b24ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare
        run: pnpm run dev:prepare

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test run

      - name: Build
        run: pnpm build
