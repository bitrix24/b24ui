name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Dispatched by release-please.yml onto its release-PR branch: PRs opened
  # with GITHUB_TOKEN fire no pull_request event, and a dispatched run on the
  # same head SHA is what satisfies a required `ci` status check.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancelling superseded runs is only safe for PR churn. A main run may be
  # the one await-ci polls before publishing a release — cancelling it strands
  # the tag with nothing on npm.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This workflow executes the most untrusted code in the repository — a full
# `pnpm install` with build scripts, then lint, typecheck, tests and build. It
# needs nothing but read access, and saying so keeps a `push` or dispatch run
# from inheriting a permissive repository default.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      pnpm_config_strict_dep_builds: false
      pnpm_config_verify_deps_before_run: false
      NUXT_PUBLIC_USE_AI: false
      NUXT_PUBLIC_SITE_URL: https://bitrix24.github.io
      NUXT_PUBLIC_BASE_URL: /b24ui
      NUXT_PUBLIC_CANONICAL_URL: https://bitrix24.github.io
      NUXT_PUBLIC_GIT_URL: https://github.com/bitrix24/b24ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinning actions to commit SHAs is a state; this is the control that keeps
      # it. The realistic way the pins get lost is not carelessness — it is a
      # port: upstream nuxt/ui bumps actions by tag, and PR #297 replayed exactly
      # such a bump here, rewriting `uses:` from @v6 to @v7. A port that does that
      # again fails here instead of silently reopening the hole.
      - name: Assert every action is pinned to a commit SHA
        run: |
          # Parsed rather than grepped, because a guard that silently skips the
          # common `- uses:` step form teaches people to stop checking. Comments
          # are stripped before validation so a real SHA in a trailing comment
          # cannot vouch for an unpinned ref next to it.
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          bad = []
          for f in sorted(p for ext in ('yml', 'yaml') for p in Path('.github').rglob(f'*.{ext}')):
              for n, line in enumerate(f.read_text().splitlines(), 1):
                  code = line.split('#', 1)[0]
                  m = re.search(r'(?:^|[-{,\s])uses:\s*(.+)$', code)
                  if not m:
                      continue
                  ref = m.group(1).strip().strip('"\'')
                  if not ref or ref.startswith('./'):
                      continue
                  if not re.fullmatch(r'[^@\s]+@[0-9a-fA-F]{40}', ref):
                      bad.append(f'{f}:{n}: {line.strip()}')

          if bad:
              print('\n'.join(bad))
              print('::error::actions must be pinned to a 40-character commit SHA (house style: keep the version in a trailing comment, which this check does not enforce)')
              sys.exit(1)
          print('all actions are SHA-pinned')
          PY

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare
        run: pnpm run dev:prepare

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test run

      - name: Build
        run: pnpm build
