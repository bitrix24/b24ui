name: Deploy to Pages 📰
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Only the deploy job needs to write Pages or mint an OIDC token. The build job
# runs `pnpm install` and five site builds — the largest third-party execution
# surface in the repository — so it stays read-only.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # `actions/configure-pages` calls GET /repos/{owner}/{repo}/pages
      # unconditionally, and with `enablement` defaulting to false it rethrows
      # rather than warning — so this job cannot drop the Pages scope entirely.
      # Read is the whole requirement: it still cannot write Pages config or mint
      # an OIDC token, which is what moving the other two grants was about.
      pages: read

    strategy:
      matrix:
        os: [ ubuntu-latest ]
        node: [ 22 ]

    env:
      # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Raise V8 heap limit: docs prerender (nuxt generate) otherwise hits the
      # default ~4GB cap and OOMs (exit 134). Runner has 16GB RAM available.
      NODE_OPTIONS: --max-old-space-size=8192
      NUXT_PUBLIC_USE_AI: false
      NUXT_PUBLIC_SITE_URL: https://bitrix24.github.io
      NUXT_PUBLIC_BASE_URL: /b24ui
      NUXT_PUBLIC_CANONICAL_URL: https://bitrix24.github.io
      NUXT_PUBLIC_GIT_URL: https://github.com/bitrix24/b24ui

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Full history is needed for the docs' git-based dates; the token is
          # not, and leaving it in .git/config puts it within reach of every
          # build script that runs afterwards.
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Explicit, not load-bearing today: pnpm turns `--frozen-lockfile` on by
      # itself whenever `CI` is set, and Actions always sets it, so the bare
      # `pnpm install` this replaces was already frozen in practice. What the
      # flag buys is that the guarantee stops depending on an environment
      # variable nothing in this repository controls, and that the one real
      # regression — someone reaching for `--no-frozen-lockfile` to get a red
      # build green — has to be written down rather than inherited from a
      # default. Asserted for every workflow by assert-lockfile-frozen.py.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare
        run: pnpm run dev:prepare

      # Build the dev playgrounds here (moved out of ci.yml to keep PR CI fast).
      # They run before the docs generation so a broken playground build fails
      # the deploy and prevents publishing docs from a broken state.
      - name: Build Nuxt playground
        run: pnpm run dev:build

      - name: Build Vue playground
        run: pnpm run dev:vue:build

      - name: Generate Docs
        run: pnpm run docs:full:generate

      - name: Generate Demo
        run: pnpm run demo:generate

      - name: Build Repl
        run: pnpm repl:build

      - name: Prepare SPA fallback
        run: |
          cd playgrounds/repl/dist
          cp index.html 404.html
          touch .nojekyll

      - name: Create combined artifact
        run: |
          mkdir -p combined-artifact
          cp -r docs/.output/public/* combined-artifact/
          mkdir -p combined-artifact/demo
          cp -r playgrounds/demo/dist/* combined-artifact/demo/
          mkdir -p combined-artifact/play
          cp -r playgrounds/repl/dist/* combined-artifact/play/
          cp playgrounds/repl/public/bitrix24-b24ui.css combined-artifact/play/
          cp playgrounds/repl/public/bitrix24-b24ui.js combined-artifact/play/
          cp playgrounds/repl/dist/.nojekyll combined-artifact/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: combined-artifact
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
