name: NPM publish 🚀

on:
  release:
    types: [ published ]
  # Also the automated path: release-please.yml dispatches this workflow with
  # --ref <tag>, so the run's sha is the tagged commit and the OIDC token's
  # workflow_ref stays this file — which is what npm trusted publishing pins.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  await-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      # A GitHub Release can be created on any commit and workflow_dispatch can
      # target any ref, but only history that went through the merge process
      # should ever reach npm. An environment branch policy cannot express this:
      # it matches ref *names*, and a release run's ref is the tag, which can
      # point at any commit — asserting the commit is merged history takes an
      # API call.
      - name: Assert ${{ github.sha }} is on main
        run: |
          # Retried: a transient API failure must not strand a tagged release,
          # and under `bash -e` an unretried $(gh api …) does exactly that.
          status=""
          for i in 1 2 3 4 5; do
            if status=$(gh api "repos/$REPO/compare/main...$SHA" --jq '.status'); then
              break
            fi
            echo "Attempt $i/5: compare API failed, retrying in 15s"
            sleep 15
          done
          echo "compare main...$SHA -> $status"
          case "$status" in
            identical|behind) echo "$SHA is merged history of main" ;;
            *) echo "$SHA is not part of main (status=$status); refusing to publish"; exit 1 ;;
          esac

      - name: Wait for ci.yml to succeed on ${{ github.sha }}
        run: |
          for i in $(seq 1 60); do
            run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" --jq '.workflow_runs[0] // empty')
            if [ -z "$run" ]; then
              echo "Attempt $i/60: no ci.yml run found yet for $SHA, retrying in 30s"
              sleep 30
              continue
            fi
            status=$(echo "$run" | jq -r '.status')
            conclusion=$(echo "$run" | jq -r '.conclusion')
            echo "Attempt $i/60: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "ci.yml succeeded on $SHA"
                exit 0
              fi
              echo "ci.yml did not succeed on $SHA (conclusion=$conclusion)"
              exit 1
            fi
            sleep 30
          done
          echo "Timed out after 30 minutes waiting for ci.yml on $SHA"
          exit 1

  process:
    needs: await-ci
    runs-on: ubuntu-latest
    # Gate the one job that holds the publishing token behind a reviewer. The
    # `npm-publish` environment must exist in repo settings with required
    # reviewers configured — without it this runs unprotected, as before.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare
        run: pnpm run dev:prepare

      - name: Build
        run: pnpm build

      # Smoke-build the dev playgrounds before publishing so a broken Nuxt or
      # Vue build blocks the release (these no longer run in PR CI).
      - name: Build Nuxt playground
        run: pnpm run dev:build

      - name: Build Vue playground
        run: pnpm run dev:vue:build

      # The trigger paths converge here. Two situations must not reach npm as
      # anything but a no-op:
      #  - a re-run for an already-published version (release recreated to fix
      #    notes, manual dispatch after the bot published) — skip, not
      #    EPUBLISHCONFLICT;
      #  - a stale run approved out of order while a newer version already
      #    shipped — publishing it would move the `latest` dist-tag backwards,
      #    so refuse and leave a clear message instead.
      - name: Skip if this version is already on npm or older than latest
        id: version-check
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version --silent >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(npm view "$name" dist-tags.latest --silent 2>/dev/null || echo "")
          if [ -n "$latest" ]; then
            newer=$(node -p "
              const p = s => s.split('-')[0].split('.').map(Number);
              const [a, b] = [p('$version'), p('$latest')];
              let r = 0;
              for (let i = 0; i < 3; i++) { if (a[i] !== b[i]) { r = a[i] > b[i] ? 1 : -1; break } }
              r
            ")
            if [ "$newer" = "-1" ]; then
              echo "::warning::$version is older than published latest $latest — refusing to publish a stale release. Publish manually if this is intended."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 'Publish 🚀'
        if: steps.version-check.outputs.skip == 'false'
        shell: bash
        run: pnpm publish --no-git-checks
