packages:
  - ./
  - cli
  - docs
  - playgrounds/nuxt
  - playgrounds/vue
  - playgrounds/repl
  - playgrounds/demo
  - test/smoke/fixture

ignoreWorkspaceRootCheck: true

linkWorkspacePackages: true

catalogMode: strict

# Every `dependencies` / `devDependencies` range in this workspace lives here and
# nowhere else; the manifests say `catalog:`. `peerDependencies` stay literal on
# purpose — they are the contract with consumers, deliberately wider than what
# this repo installs, and upstream keeps them out of the catalog for the same
# reason.
#
# This is what §2's "a dep present in both nuxt and demo must not drift" looks
# like when a tool enforces it instead of a reviewer: adopting the catalog turned
# up two live drifts the hand-kept invariant had missed — `maska` (demo ^3.2.1
# against nuxt ^3.2.0) and `tailwindcss` (demo ^4.3.2 against everyone else's
# ^4.3.3) — both converged upward here.
catalog:
  '@bitrix24/b24icons-nuxt': ^2.0.7
  '@bitrix24/b24icons-vue': ^2.0.7
  '@bitrix24/b24ui-nuxt': 'workspace:*'
