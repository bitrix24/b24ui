packages:
  - ./
  - cli
  - docs
  - playgrounds/nuxt
  - playgrounds/vue
  - playgrounds/repl
  - playgrounds/demo

ignoreWorkspaceRootCheck: true

linkWorkspacePackages: true

overrides:
  '@nuxt/kit': ^4.5.2
  '@bitrix24/b24ui-nuxt': workspace:*
  # nuxt 4.5.x requires vite ^8, but several peers (unplugin, unhead, vite-plugin-*)
  # still resolve vite 7 — two vite copies mean two rolldown native ABIs in one
  # process, which breaks vitest's pool ("Missing field `moduleType`").
  vite: ^8.2.1
  # vite pins one rolldown line; unplugin accepts any, so pnpm otherwise also
  # installs a second one and the two native ABIs collide in the same worker
  # process. Keep this in step with whatever `vite` above resolves to —
  # vite 8.1.x wants ~1.1.5, vite 8.2.x wants ~1.2.1.
  rolldown: ~1.2.1
  # `@nuxt/image` 2.1.0 depends on `ipx` 4.0.0-beta.1, which pulls a second sharp
  # alongside 0.34.5 and kills the docs prerender as soon as it hits `/_ipx`.
  # Pinned until ipx 4 is stable. `docs` only declares `^2.0.0`, so without this
  # the next lockfile regeneration floats to 2.1.0 on its own.
  '@nuxt/image': 2.0.0
  # tailwind-variants 3.3.x is a full internal rewrite: invoking a tv() result is
  # 18 to 103x slower than 3.2.2 (see test/bench/tv.bench.ts) and the exported
  # type constraints changed in a breaking way. This module calls `tv()` on every
  # component render, so the regression lands on consumers, not just on CI.
  # Pinned until upstream addresses the perf regression.
  tailwind-variants: 3.2.2
  '@tiptap/pm': ^3.29.2
  nitropack: ^2.13.0
  unplugin: ^3.3.0
  c12: ^3.3.4
  h3: 1.15.11
  unimport: 6.0.2
  nuxtseo-shared: 5.2.6
  # ajv declares `fast-uri: ^3.0.1` and this lockfile sat on 3.1.0, which carries
  # five advisories (path traversal and host confusion via percent-encoded or
  # backslash authority delimiters); 3.1.5 is the fixed release in that line, so
  # this is a lockfile move rather than a forced upgrade.
  # What it fixes is *this* repository's tree — where the publishing token lives.
  # Consumers were never pinned to 3.1.0: no lockfile is published, so their
  # package manager resolves ajv's own `^3.0.1` and already picks up 3.1.5. The
  # chain does reach them (@unhead/vue is a runtime dependency, so ajv and
  # fast-uri land in their node_modules, unlike the dev-only trees under docs/
  # and playgrounds/) — but they were not the ones exposed by the stale entry.
  # Scoped to the 3.x range so a future dependency on fast-uri 4 is not forced
  # backwards.
  'fast-uri@^3.0.0': ^3.1.5

allowBuilds:
  # `docs` no longer needs this one — it runs @nuxt/content on the `native`
  # (node:sqlite) connector since #322 — but better-sqlite3 is still pulled in
  # transitively and is still the default connector for everyone else, which is
  # why the integrations/content page tells readers to allow exactly this
  # package. Removing the entry here would quietly contradict that page.
  better-sqlite3: true
  puppeteer: true
  sharp: true
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  '@vercel/speed-insights': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false
