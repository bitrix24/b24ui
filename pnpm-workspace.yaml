packages:
  - ./
  - cli
  - docs
  - playgrounds/nuxt
  - playgrounds/vue
  - playgrounds/repl
  - playgrounds/demo

ignoreWorkspaceRootCheck: true

linkWorkspacePackages: true

overrides:
  '@nuxt/kit': ^4.5.1
  '@bitrix24/b24ui-nuxt': workspace:*
  # nuxt 4.5.1 requires vite ^8, but several peers (unplugin, unhead, vite-plugin-*)
  # still resolve vite 7 — two vite copies mean two rolldown native ABIs in one
  # process, which breaks vitest's pool ("Missing field `moduleType`").
  vite: ^8.1.5
  # vite 8 pins rolldown ~1.1.5; unplugin accepts any, so pnpm otherwise also
  # installs 1.2.0 and the two native ABIs collide in the same worker process.
  rolldown: ~1.1.5
  '@tiptap/pm': ^3.29.0
  nitropack: ^2.13.0
  unplugin: ^3.3.0
  c12: ^3.3.4
  h3: 1.15.11
  unimport: 6.0.2
  nuxtseo-shared: 5.2.6
  # ajv declares `fast-uri: ^3.0.1` and the lockfile sat on 3.1.0, which carries
  # five advisories (path traversal and host confusion via percent-encoded or
  # backslash authority delimiters); 3.1.5 is the fixed release in that line.
  # This is the one vulnerable chain that reaches consumers — @unhead/vue is a
  # runtime dependency, so ajv and fast-uri land in their node_modules, unlike
  # the dev-only trees under docs/ and playgrounds/. Scoped to the 3.x range so
  # a future dependency on fast-uri 4 is not forced backwards.
  'fast-uri@^3.0.0': ^3.1.5

allowBuilds:
  better-sqlite3: true
  puppeteer: true
  sharp: true
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  '@vercel/speed-insights': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false
